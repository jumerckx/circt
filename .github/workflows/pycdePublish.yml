name: PyCDE Publish

on:
  push:
    tags:
      - pycde-*
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  #  Build and test Linux wheels. Run the CIRCT tests also.
  # ---------------------------------------------------------------------------

  build-linux:
    name: Build
    # Run on an internal MSFT subscription. Please DO NOT use this for any other
    # workflows without talking to John Demme (john.demme@microsoft.com, GH
    # teqdruid) first. We may lose funding for this if it ends up costing too
    # much.
    # If individual jobs fail due to timeouts or disconnects, please report to
    # John and re-run the job.
    runs-on:
      - self-hosted
      - 1ES.Pool=1ES-CIRCT-builds
      - 1ES.ImageOverride=CIRCT-StdUbuntu2204
    strategy:
      matrix:
        python-env:
          - cp310-manylinux_x86_64
          - cp311-manylinux_x86_64
          - cp312-manylinux_x86_64
          - cp313-manylinux_x86_64
          - cp314-manylinux_x86_64
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get CIRCT (no submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Get shallow LLVM submodule
        run: |
          git submodule update --init --recursive --recommend-shallow --depth 1

      - name: Install dependencies
        run: |
          set -o errexit
          python3 -m pip install --upgrade pip
          python3 -m pip install cibuildwheel twine

      # Build CIRCT and run its tests using a Docker container with all the
      # integration testing prerequisite installed.
      - name: Build wheel
        env:
          CIBW_BUILD: ${{ matrix.python-env }}
          CMAKE_GENERATOR: Ninja
          SETUPTOOLS_SCM_DEBUG: True
          BUILD_TYPE: Release
          RUN_TESTS: True
        run: |
          set -o errexit
          export PATH=$PATH:$HOME/.local/bin

          echo "Building wheel"
          cibuildwheel --output-dir wheelhouse frontends/PyCDE

      - name: Get wheel name
        shell: bash
        id: whl-name
        run: |
          cd wheelhouse
          echo WHL=`ls *.whl` >> "$GITHUB_OUTPUT"

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.whl-name.outputs.WHL }}
          path: wheelhouse/${{ steps.whl-name.outputs.WHL }}
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  #  Build and test Windows wheels.
  # ---------------------------------------------------------------------------

  build-windows:
    name: Build
    # Run on an internal MSFT subscription. Please DO NOT use this for any other
    # workflows without talking to John Demme (john.demme@microsoft.com, GH
    # teqdruid) first. We may lose funding for this if it ends up costing too
    # much.
    # If individual jobs fail due to timeouts or disconnects, please report to
    # John and re-run the job.
    runs-on:
      - self-hosted
      - 1ES.Pool=1ES-CIRCT-builds
      - 1ES.ImageOverride=1esMMSWindows2022
    strategy:
      matrix:
        python-env:
          - cp310-win_amd64
          - cp311-win_amd64
          - cp312-win_amd64
          - cp313-win_amd64
          - cp314-win_amd64
    steps:
      # Since we don't use docker on Windows, we need to install the dependencies.
      - name: Build additional c++ deps
        shell: pwsh
        run: |
          & "${env:VCPKG_INSTALLATION_ROOT}/vcpkg" --triplet x64-windows install zlib

      - name: Get CIRCT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Get shallow LLVM submodule
        run: |
          git submodule update --init --recursive --recommend-shallow --depth 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel twine
          choco install ninja

      - name: Build wheel
        shell: cmd
        env:
          CIBW_BUILD: ${{ matrix.python-env }}
          CMAKE_GENERATOR: Ninja
          SETUPTOOLS_SCM_DEBUG: True
          BUILD_TYPE: Release
          # PyCDE integration tests are not yet implemented on Windows.
          RUN_TESTS: False
        run: |
          echo "Building wheel"
          "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 && python -m cibuildwheel --output-dir wheelhouse frontends/PyCDE

      - name: Get wheel name
        shell: bash
        id: whl-name
        run: |
          cd wheelhouse
          echo WHL=`ls *.whl` >> "$GITHUB_OUTPUT"

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.whl-name.outputs.WHL }}
          path: wheelhouse/${{ steps.whl-name.outputs.WHL }}
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  #  Build and test macOS wheels.
  # ---------------------------------------------------------------------------

  build-macos:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: macos-14
            python-env: cp310-macosx_arm64
          - os: macos-14
            python-env: cp311-macosx_arm64
          - os: macos-14
            python-env: cp312-macosx_arm64
          - os: macos-14
            python-env: cp313-macosx_arm64
          - os: macos-14
            python-env: cp314-macosx_arm64
          - os: macos-13
            python-env: cp310-macosx_x86_64
          - os: macos-13
            python-env: cp311-macosx_x86_64
          - os: macos-13
            python-env: cp312-macosx_x86_64
          - os: macos-13
            python-env: cp313-macosx_x86_64
          - os: macos-13
            python-env: cp314-macosx_x86_64
    runs-on: ${{ matrix.config.os }}
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get CIRCT (no submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Get shallow LLVM submodule
        run: |
          git submodule update --init --recursive --recommend-shallow --depth 1

      - name: Install dependencies
        run: |
          set -o errexit
          brew install ninja
          python3 -m pip install --upgrade pip
          python3 -m pip install cibuildwheel twine

      - name: Build wheel
        env:
          CIBW_BUILD: ${{ matrix.config.python-env }}
          CMAKE_GENERATOR: Ninja
          SETUPTOOLS_SCM_DEBUG: True
          BUILD_TYPE: Release
          # PyCDE integration tests are not yet enabled on macOS wheels.
          RUN_TESTS: False
        run: |
          set -o errexit
          export PATH=$PATH:$HOME/.local/bin

          echo "Building wheel"
          cibuildwheel --output-dir wheelhouse frontends/PyCDE

      - name: Get wheel name
        shell: bash
        id: whl-name
        run: |
          cd wheelhouse
          echo WHL=`ls *.whl` >> "$GITHUB_OUTPUT"

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.whl-name.outputs.WHL }}
          path: wheelhouse/${{ steps.whl-name.outputs.WHL }}
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  #  If the Linux, Windows, and macOS builds are successful, push the wheels to
  #  pypi. Only do this on the main branch or a tag.
  # ---------------------------------------------------------------------------

  push_wheels:
    name: Push wheels (Tag or Weekly)
    runs-on: ubuntu-24.04
    if: github.repository == 'llvm/circt' && ( github.ref == 'refs/heads/main' || github.ref_type == 'tag' )
    needs:
      - build-linux
      - build-windows
      - build-macos
    environment:
      name: pypi
      url: https://pypi.org/p/esiaccel
    permissions:
      id-token: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: ./wheelhouse/
          merge-multiple: true

      - name: List downloaded wheels
        run: ls -laR
        working-directory: ./wheelhouse/

      - name: Remove macOS wheels before PyPI upload
        # macOS wheels are still kept as GitHub artifacts (uploaded by the
        # build-macos job), but are intentionally not published to PyPI.
        run: |
          shopt -s nullglob
          for f in wheelhouse/*macosx*.whl; do
            echo "Skipping macOS wheel for PyPI: $f"
            rm -f "$f"
          done

      - name: Upload wheels to pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse/
          verify-metadata: false
