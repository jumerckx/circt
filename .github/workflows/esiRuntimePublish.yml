name: Publish ESI Runtime

on:
  push:
    tags:
      - ESIRuntime-*
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels with ${{ matrix.config.cibw_build }}
    runs-on: ${{ matrix.config.os }}
    if: github.repository == 'llvm/circt'
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-24.04
            cibw_build: cp39-manylinux_x86_64
          - os: ubuntu-24.04
            cibw_build: cp310-manylinux_x86_64
          - os: ubuntu-24.04
            cibw_build: cp311-manylinux_x86_64
          - os: ubuntu-24.04
            cibw_build: cp312-manylinux_x86_64
          - os: ubuntu-24.04
            cibw_build: cp313-manylinux_x86_64
          - os: ubuntu-24.04
            cibw_build: cp314-manylinux_x86_64
          - os: windows-2022
            cibw_build: cp39-win_amd64
          - os: windows-2022
            cibw_build: cp310-win_amd64
          - os: windows-2022
            cibw_build: cp311-win_amd64
          - os: windows-2022
            cibw_build: cp312-win_amd64
          - os: windows-2022
            cibw_build: cp313-win_amd64
          - os: windows-2022
            cibw_build: cp314-win_amd64
          - os: macos-14
            cibw_build: cp310-macosx_arm64
          - os: macos-14
            cibw_build: cp311-macosx_arm64
          - os: macos-14
            cibw_build: cp312-macosx_arm64
          - os: macos-14
            cibw_build: cp313-macosx_arm64
          - os: macos-14
            cibw_build: cp314-macosx_arm64
          - os: macos-13
            cibw_build: cp310-macosx_x86_64
          - os: macos-13
            cibw_build: cp311-macosx_x86_64
          - os: macos-13
            cibw_build: cp312-macosx_x86_64
          - os: macos-13
            cibw_build: cp313-macosx_x86_64
          - os: macos-13
            cibw_build: cp314-macosx_x86_64

    steps:
      - name: Get CIRCT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps with choco (Windows)
        shell: pwsh
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Install deps with brew (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja grpc protobuf

      - name: Setup vcpkg binary caching (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgBinaryCacheDir = "${{ github.workspace }}\vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $vcpkgBinaryCacheDir
          echo "VCPKG_BINARY_SOURCES=clear;files,$vcpkgBinaryCacheDir,readwrite" >> $env:GITHUB_ENV

      - name: Cache vcpkg binaries (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-x64-windows-zlib-grpc
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-zlib-grpc
            vcpkg-${{ runner.os }}-x64-windows-

      - name: Build additional c++ deps (Windows)
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          & "${env:VCPKG_INSTALLATION_ROOT}/vcpkg" --triplet x64-windows install zlib grpc

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.3.0

      - name: Build wheels (Linux)
        if: runner.os == 'Linux'
        env:
          CIBW_BUILD: ${{ matrix.config.cibw_build }}
          SETUPTOOLS_SCM_DEBUG: True
        run: python -m cibuildwheel --output-dir wheelhouse ./lib/Dialect/ESI/runtime

      - name: Build wheels (macOS)
        if: runner.os == 'macOS'
        env:
          CIBW_BUILD: ${{ matrix.config.cibw_build }}
          SETUPTOOLS_SCM_DEBUG: True
        run: |
          # Make brew-installed gRPC/protobuf discoverable by CMake. Brew lives
          # under /opt/homebrew on Apple Silicon and /usr/local on Intel.
          BREW_PREFIX="$(brew --prefix)"
          export CIBW_ENVIRONMENT_MACOS="CMAKE_PREFIX_PATH=$BREW_PREFIX SETUPTOOLS_SCM_DEBUG=True"
          python -m cibuildwheel --output-dir wheelhouse ./lib/Dialect/ESI/runtime

      - name: Build wheels (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CIBW_BUILD: ${{ matrix.config.cibw_build }}
          SETUPTOOLS_SCM_DEBUG: True
        run: |
          echo "Building wheel"
          & "${env:GITHUB_WORKSPACE}\utils\find-vs.ps1"
          python3 -m cibuildwheel --output-dir wheelhouse ./lib/Dialect/ESI/runtime

      - name: Get wheel name
        shell: bash
        id: whl-name
        run: |
          cd wheelhouse
          echo WHL=`ls *.whl` >> "$GITHUB_OUTPUT"

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.whl-name.outputs.WHL }}
          path: wheelhouse/${{ steps.whl-name.outputs.WHL }}
          retention-days: 7
          if-no-files-found: error

  push_wheels:
    name: Push wheels (Tag or Weekly)
    runs-on: ubuntu-24.04
    needs: build_wheels
    environment:
      name: pypi
      url: https://pypi.org/p/esiaccel
    permissions:
      id-token: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: ./wheelhouse/
          merge-multiple: true

      - name: List downloaded wheels
        run: ls -laR
        working-directory: ./wheelhouse/

      - name: Remove macOS wheels before PyPI upload
        # macOS wheels are still kept as GitHub artifacts (uploaded by the
        # build job), but are intentionally not published to PyPI.
        run: |
          shopt -s nullglob
          for f in wheelhouse/*macosx*.whl; do
            echo "Skipping macOS wheel for PyPI: $f"
            rm -f "$f"
          done

      - name: Upload wheels to pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        if: github.repository == 'llvm/circt' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
        with:
          packages-dir: wheelhouse/
          verify-metadata: false
          verbose: true
